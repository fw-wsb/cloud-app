services:
  db:
    image: mcr.microsoft.com/azure-sql-edge
    container_name: cloud-db
    environment:
      SA_PASSWORD: "StrongPassword123!"
      ACCEPT_EULA: "Y"
    ports:
      - "1433:1433"
    volumes:
      - sql-data:/var/opt/mssql
    networks:
      - cloud-network

  backend:
    build: ./Application/Backend
    container_name: cloud-backend
    ports:
      - "8081:8080"
    depends_on:
      - db
    networks:
      - cloud-network

  frontend:
    build: ./Presentation
    container_name: cloud-frontend
    ports:
      - "8080:80"
    networks:
      - cloud-network

networks:
  cloud-network:

volumes:
  sql-data: