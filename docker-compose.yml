version: '3.8'

services:
  frontend:
    image: nginx:alpine
    ports:
      - "80:80"

  backend:
    image: node:24-alpine
    command: node -e "require('http').createServer((req, res) => res.end('API')).listen(5000);"
    ports:
      - "5000:5000"

  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: cloudapp
    ports:
      - "5432:5432"